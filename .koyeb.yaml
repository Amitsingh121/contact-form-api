app:
  name: contact-form-api
  regions:
    - fra
  services:
    - name: web
      type: web
      git:
        branch: main
        buildpack: nodejs
      instance_type: nano
      ports:
        - port: 8000
          protocol: http
      routes:
        - path: /
          port: 8000
      env:
        - key: NODE_ENV
          value: production
        - key: NPM_CONFIG_PRODUCTION
          value: "true"
      build:
        command: npm ci --omit=dev
      run:
        command: npm start
      regions:
        - fra
      scaling:
        min: 1
        max: 1
